name: Sec3
description: 'Sec3 (formerly Soteria) is a Solana-native security firm, founded in
  2021, providing smart-contract security audits, formal verification, and post-deployment
  on-chain monitoring for high-stakes protocols and institutions building on Solana.
  The team combines manual security review by experienced researchers with automated
  tooling and formal methods, and maintains open-source tools including the X-Ray
  static analysis scanner and IDL Guesser. Sec3 has secured protocols such as the
  Solana Foundation, Wormhole, Kamino Finance, Helium Network, Jupiter, Orca, Metaplex,
  and Solana Mobile, publishes an annual Solana Security Ecosystem Report, and offers
  free nonce and multisig monitoring tooling. Surfaced as a portfolio company of Multicoin
  Capital and enriched from Sec3''s public surface; it is a security-services firm
  with no self-serve public API.'
